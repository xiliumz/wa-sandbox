version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WEBHOOK_URL: ${VITE_WEBHOOK_URL}
        VITE_VERIFY_TOKEN: ${VITE_VERIFY_TOKEN}
        VITE_APP_SECRET: ${VITE_APP_SECRET}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL}
        VITE_POLL_INTERVAL: ${VITE_POLL_INTERVAL}
        VITE_USER_PHONE: ${VITE_USER_PHONE}
        VITE_BUSINESS_PHONE: ${VITE_BUSINESS_PHONE}
    ports:
      - "4000:80"
    environment:
      # Runtime var for envsubst in nginx.conf.template (not build-time)
      - BACKEND_PORT=${BACKEND_PORT:-4001}
    depends_on:
      - backend

  backend:
    build:
      context: server
      dockerfile: Dockerfile
    environment:
      - PORT=${BACKEND_PORT:-4001}
