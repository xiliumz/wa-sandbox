services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WEBHOOK_URL: ${VITE_WEBHOOK_URL}
        VITE_VERIFY_TOKEN: ${VITE_VERIFY_TOKEN}
        VITE_APP_SECRET: ${VITE_APP_SECRET}
        VITE_USER_PHONE: ${VITE_USER_PHONE}
        VITE_BUSINESS_PHONE: ${VITE_BUSINESS_PHONE}
    container_name: wa-sandbox-frontend
    ports:
      - "4000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wa-sandbox

  backend:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: wa-sandbox-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - wa-sandbox

networks:
  wa-sandbox:
    driver: bridge
